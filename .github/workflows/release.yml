name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true
        type: string
      publish:
        description: Publish only after every native platform/archive smoke succeeds
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/platform-check.yml
    with:
      source_ref: ${{ inputs.tag || github.ref_name }}
  release:
    name: Publish verified archives
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate immutable annotated tag and manifest version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo 'Expected release version tag'; exit 1;; esac
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          VERSION=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          test "$TAG" = "v$VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: vqtrs-*
          merge-multiple: true
          path: artifacts
      - name: Verify all four archives and checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd artifacts
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            test -s "checksums-$target.txt"
            test -s "archive-smoke-$target.json"
            jq -e --arg version "${TAG#v}" '.status == "passed" and .version == $version and .dimensions == 384 and .finite_unit_norm == true and .http_cli_parity == true and .prebody_shedding_retry_after == true' "archive-smoke-$target.json"
            sha256sum -c "checksums-$target.txt"
            if [ "$target" = x86_64-pc-windows-msvc ]; then EXT=zip; else EXT=tar.gz; fi
            test -s "vqtrs-$TAG-$target.$EXT"
          done
          cat checksums-*.txt > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Default ONNX-only archives; optional GPU/native backends require source builds.
            Native runners verify relocated inference, CLI/HTTP and Unix UDS where supported.
            Intel macOS13+ includes pinned CPU ONNX Runtime1.24.2/API24, reviewed
            upstream compile-only Clang guard fix and notices. Rust/Clippy1.97.0 is pinned.
            Windows uses TCP API/local CLI. Native Apple workers need private setup.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
            artifacts/archive-smoke-*.json
