[package]
name = "vqtrs-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "OpenAI-compatible embeddings + reranking HTTP server backed by vqtrs-core"

[lints]
workspace = true

[features]
default = []
# Compile the Qwen3 candle backend into the server.
qwen3 = ["vqtrs-core/qwen3"]
# ONNX GPU/accel (ort execution providers).
cuda = ["vqtrs-core/cuda"]
tensorrt = ["vqtrs-core/tensorrt"]
coreml = ["vqtrs-core/coreml"]
directml = ["vqtrs-core/directml"]
# Qwen3 (candle) GPU.
qwen3-cuda = ["vqtrs-core/qwen3-cuda"]
qwen3-metal = ["vqtrs-core/qwen3-metal"]

[[bin]]
name = "vqtrs-api"
path = "src/main.rs"

[dependencies]
vqtrs-core.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
env_logger.workspace = true
log.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
