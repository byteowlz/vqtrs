[package]
name = "vqtrs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lean local embeddings + reranking engine (fastembed/ONNX + Qwen3 candle backend)"

[lints]
workspace = true

[features]
default = []
# Qwen3-Embedding via the candle backend. Off by default — pulls candle and is
# the heaviest part of the build. Enable for the SOTA 0.6B/4B/8B models.
qwen3 = ["fastembed/qwen3", "dep:candle-core"]

# ONNX GPU/accel via ort execution providers (independent of qwen3).
cuda = ["dep:ort", "ort/cuda"]
tensorrt = ["dep:ort", "ort/tensorrt"]
coreml = ["dep:ort", "ort/coreml"]
directml = ["dep:ort", "ort/directml"]

# Qwen3 (candle) GPU. Each implies `qwen3`.
qwen3-cuda = ["qwen3", "fastembed/cuda"]
qwen3-metal = ["qwen3", "fastembed/metal"]

# EmbeddingGemma 2 via vqtrs' own candle backend; GPU is per-backend.
embeddinggemma2 = [
  "dep:candle-core",
  "dep:candle-nn",
  "dep:ndarray",
  "dep:hf-hub",
  "dep:image",
  "dep:serde",
  "dep:serde_json",
]

embeddinggemma2-cuda = ["embeddinggemma2", "candle-core/cuda", "candle-nn/cuda"]
embeddinggemma2-metal = ["embeddinggemma2", "candle-core/metal", "candle-nn/metal"]

[dependencies]
fastembed.workspace = true
tokenizers.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Direct ort handle for constructing execution providers; pinned to fastembed's
# ort. Activated only by the ONNX accel features above.
ort = { version = "=2.0.0-rc.12", default-features = false, optional = true }
thiserror.workspace = true
anyhow.workspace = true
dirs.workspace = true

# On macOS the PyTorch reference runs its GEMMs through Accelerate's sgemm;
# routing candle's matmul through the same library is what makes the
# EmbeddingGemma 2 backend bit-identical for every matrix shape.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, optional = true, features = ["accelerate"] }
candle-nn = { workspace = true, optional = true, features = ["accelerate"] }
# candle exposes only beta=0 matmul; ndarray's safe GEMM can accumulate the
# bias with beta=1 as PyTorch addmm does, using the same Accelerate library.
ndarray = { workspace = true, optional = true, features = ["blas"] }

[[example]]
name = "eg2_parity"
required-features = ["embeddinggemma2"]
